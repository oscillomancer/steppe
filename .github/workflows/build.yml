# Copyright (c) 2026 Supple Audio
# Build and test on demand, never on ordinary branch pushes.
# Once on the default branch: gh workflow run build.yml --ref <branch> -f platforms=macos
# Before integration: git tag -a ci/<branch>-<n> -m 'platforms=macos'
#                    git push origin <branch> refs/tags/ci/<branch>-<n>
# Omit the annotation (or use platforms=all) to run all three platforms.
# Delete the remote tag after the run: git push origin :refs/tags/ci/<branch>-<n>
# An iteration run may narrow itself: -f targets='engine.tests ...' -f tests='^engine'
# (the tests' executables must be among the targets), and chase an intermittent
# failure with -f repeat=<n> -f scribble=true. Merges need a run without them.
# Linux runs the full dev preset; macOS arm64 and Windows clang-cl run all
# currently portable targets/tests. Port gates are listed in CONTRIBUTING.md.
name: Build and test
# A narrowed iteration run says so in its title, so it never reads as a full
# run in `gh run list` or on the branch page (review round 111, E2).
run-name: >-
  ${{ github.event_name == 'push' && format('{0} {1}', github.workflow, github.ref_name)
  || format('{0} ({1}){2}', github.workflow, inputs.platforms,
  (inputs.targets != '' || inputs.tests != '' || inputs.repeat != '' || inputs.scribble)
  && format(' ITERATION, not a merge gate: targets "{0}", tests "{1}", repeat "{2}", scribble {3}',
  inputs.targets, inputs.tests, inputs.repeat, inputs.scribble)
  || '') }}

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build and test
        type: choice
        options: [linux, macos, windows, all]
        default: all
      # Iteration runs only; a run that gates a merge leaves both empty.
      targets:
        description: Build only these targets (space-separated; empty builds everything)
        type: string
        default: ''
      tests:
        description: Run only the CTest entries matching this regex (empty runs all)
        type: string
        default: ''
      # Chasing an intermittent failure: rerun the selected tests until one
      # fails, with junk in fresh and freed heap memory if asked.
      repeat:
        description: Rerun each selected test until it fails, at most this many times (empty runs once)
        type: string
        default: ''
      scribble:
        description: Junk-fill heap memory (macOS MallocPreScribble and MallocScribble, Linux MALLOC_PERTURB_)
        type: boolean
        default: false
  push:
    tags: ['ci/**']

permissions:
  contents: read

# Dispatches for different platforms on one branch run side by side; a new
# one for the same platforms supersedes the old (the jobs' own groups too).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platforms || 'all' }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: '1'
  CMAKE_BUILD_PARALLEL_LEVEL: '6'
  SUPPLE_REQUIRE_OFFSCREEN: '1'
  # The on-screen plug-in editor probes (plugins/EditorProbes.cmake) run here,
  # under Xvfb on Linux; on a developer's desktop they are opt-in.
  SUPPLE_EDITOR_PROBE_TEST: '1'
  # The script compiler's comma-decimal locale test fails instead of skipping.
  SUPPLE_REQUIRE_COMMA_LOCALE: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      branch: ${{ steps.plan.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          platforms=${INPUT_PLATFORMS:-all}
          branch=$GITHUB_REF_NAME
          if [[ $GITHUB_REF == refs/tags/ci/* ]]; then
            branch=${GITHUB_REF_NAME#ci/}
            branch=${branch%-*}
            # checkout can replace annotated refs with the event's commit SHA.
            git fetch --force origin "$GITHUB_REF:$GITHUB_REF"
            choice=$(git for-each-ref --format='%(contents:subject)' "$GITHUB_REF")
            if [[ $choice == platforms=* ]]; then platforms=${choice#platforms=}; fi
          fi
          case "$platforms" in linux|macos|windows|all) ;; *) echo "Invalid platforms: $platforms"; exit 1 ;; esac
          matrix=$(jq -cn --arg choice "$platforms" '{include: [
            {platform:"linux", runner:"ubuntu-24.04", preset:"dev"},
            {platform:"macos", runner:"macos-15", preset:"macos"},
            {platform:"windows", runner:"windows-2022", preset:"windows"}
          ] | map(select($choice == "all" or .platform == $choice))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.platform }} (${{ matrix.preset }})
    runs-on: ${{ matrix.runner }}
    # Native source-export conformance builds all thirteen projects serially.
    # Leave room for those tests without increasing compiler concurrency.
    # Linux too: a slow runner's build took 36 min against the usual 25, and
    # its job hit 90 (run 45077330993).
    timeout-minutes: ${{ matrix.platform == 'macos' && 150 || 120 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Different ci/<branch>-<n> tags still cancel superseded platform builds.
    concurrency:
      group: build-${{ needs.plan.outputs.branch }}-${{ matrix.platform }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Cache dependencies
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/*', 'tools/validator/build.sh', 'vcpkg.json') }}

      # System packages below belong to disposable runners, never the workstation.
      - name: Linux tools and libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build ccache libx11-dev libxcursor-dev libxrandr-dev libxext-dev \
            libgl1-mesa-dev libegl1-mesa-dev zlib1g-dev \
            libasound2-dev libwayland-dev libxkbcommon-dev xvfb xauth locales
          sudo locale-gen de_DE.UTF-8
          wget -q https://apt.llvm.org/llvm.sh -O "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
          .github/scripts/sdl3.sh
          echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/.deps/install" >> "$GITHUB_ENV"
          # Match local dev coverage, including the optional external validator.
          export XDG_CACHE_HOME="$GITHUB_WORKSPACE/.deps/cache"
          validator=$(tools/validator/build.sh)
          echo "CLAP_VALIDATOR_BIN=$validator" >> "$GITHUB_ENV"

      # AppleClang/system libc++; shared MIT fast_float supplies float parsing.
      # SDK zlib, arm64, macOS 14.4. No bundled C++ runtime is required.
      - name: macOS tools and libraries
        if: matrix.platform == 'macos'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_CACHE="$GITHUB_WORKSPACE/.deps/homebrew"
          # Link backups belong to the previous runner, unlike bottle downloads.
          rm -rf "$HOMEBREW_CACHE/Backup"
          brew install ninja sdl3 ccache
          test "$(uname -m)" = arm64
          xcrun clang --version
          # The pinned clap-validator, as on Linux (the runner has cargo).
          export XDG_CACHE_HOME="$GITHUB_WORKSPACE/.deps/cache"
          validator=$(tools/validator/build.sh)
          echo "CLAP_VALIDATOR_BIN=$validator" >> "$GITHUB_ENV"

      # Ninja/clang-cl still need the Windows SDK and link.exe environment.
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'
      - name: Windows dependencies (vcpkg binary cache)
        if: matrix.platform == 'windows'
        run: |
          mkdir -p .deps/vcpkg-binaries
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$(cygpath -m "$GITHUB_WORKSPACE/.deps/vcpkg-binaries"),readwrite" >> "$GITHUB_ENV"
          clang-cl --version
          # The pinned clap-validator, as on Linux (the runner has cargo).
          export XDG_CACHE_HOME="$GITHUB_WORKSPACE/.deps/cache"
          validator=$(tools/validator/build.sh)
          echo "CLAP_VALIDATOR_BIN=$validator" >> "$GITHUB_ENV"

      # ccache for clang-cl, from Chocolatey (preinstalled on the runner image). A failed
      # install leaves the build uncached, not broken: Configure checks for it.
      - name: Windows ccache
        if: matrix.platform == 'windows'
        continue-on-error: true
        run: |
          choco install ccache -y --no-progress --limit-output
          ccache --version
      - name: Restore Windows compiler cache
        if: matrix.platform == 'windows'
        id: windows-compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: .compiler-cache
          key: clangcl-${{ runner.arch }}-${{ github.sha }}
          restore-keys: clangcl-${{ runner.arch }}-
      # Shared core libraries are compiled in several isolated plugin builds.
      - name: Restore Linux compiler cache
        if: matrix.platform == 'linux'
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: .compiler-cache
          key: clang22-${{ runner.arch }}-${{ github.sha }}
          restore-keys: clang22-${{ runner.arch }}-
      - name: Restore macOS compiler cache
        if: matrix.platform == 'macos'
        id: macos-compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: .compiler-cache
          key: appleclang-${{ runner.arch }}-${{ github.sha }}
          restore-keys: appleclang-${{ runner.arch }}-
      - name: Configure
        run: |
          if [[ '${{ matrix.platform }}' == linux ]]; then
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.compiler-cache" >> "$GITHUB_ENV"
            echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
            # Export tests configure fresh child projects; CMake reads these
            # defaults even when the exported project's command has no flags.
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            # 500M was full (the saved cache was 483 to 544 MB) and a restored cache
            # saved almost no build time; macOS at 1G does not fill up.
            echo "CCACHE_MAXSIZE=1.5G" >> "$GITHUB_ENV"
            # At most two links at a time (compiles stay at the build's own width): the
            # last dozen executables are about 600 MB each with debug info, and six
            # GNU ld links at once are the likely cause of the runner lost mid-build
            # (runs 45285459726, 45314588844). The nested plugin projects do not read
            # these and build with one job already.
            cmake --preset dev -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_JOB_POOLS=link=2 -DCMAKE_JOB_POOL_LINK=link
          elif [[ '${{ matrix.platform }}' == macos ]]; then
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.compiler-cache" >> "$GITHUB_ENV"
            echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
            # Export tests configure fresh child projects; CMake reads these
            # defaults even when the exported project's command has no flags.
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
            cmake --preset macos -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          elif [[ '${{ matrix.platform }}' == windows ]] && command -v ccache > /dev/null; then
            echo "CCACHE_DIR=$(cygpath -m "$GITHUB_WORKSPACE/.compiler-cache")" >> "$GITHUB_ENV"
            echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
            # ccache cannot cache an object whose debug information goes to a PDB at
            # compile time (/Zi); /Z7 embeds it, and clang-cl treats /Zi as /Z7 already, so
            # the objects are the same. CI only: the windows preset is unchanged, and the
            # isolated plugin builds (60% of the compiles) take the setting from here.
            cmake --preset windows -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          else
            echo "::warning title=No ccache::ccache is not installed; this Windows build is uncached"
            cmake --preset ${{ matrix.preset }}
          fi
      # Preserve expensive dependencies even when the compiler/test stage fails.
      - name: Save dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # Memory and disk around the Linux build and tests, printed into the job
      # log. A run whose runner is lost keeps none of this: the two lost runs'
      # logs were gone entirely. The readings help when the runner survives to
      # the next logging step, and a green run shows its peak. They only report,
      # so none of them may fail a run (continue-on-error).
      - name: Linux memory and disk before Build
        if: matrix.platform == 'linux'
        continue-on-error: true
        run: |
          free -m
          df -h / "$GITHUB_WORKSPACE"
          nproc
          du -sh .deps .compiler-cache 2>/dev/null || true
          # A sampler for the Build step: available memory and free root disk every
          # 15 s, started detached here, stopped and summarised after Build. The
          # summary shows the peak of a green run, and of a Build that fails with
          # the runner still alive; a lost runner prints nothing.
          cat > "$RUNNER_TEMP/memsampler.sh" <<'SAMPLER'
          #!/bin/bash
          # usage: memsampler.sh <log> <pidfile>: "HH:MM:SS MemAvailable_MB RootAvail_MB" every 15 s
          echo $$ > "$2"
          while :; do
            printf '%s %s %s\n' "$(date +%H:%M:%S)" \
              "$(awk '/^MemAvailable:/ { print int($2 / 1024) }' /proc/meminfo)" \
              "$(df --output=avail -m / | tail -n 1 | tr -d ' ')" >> "$1"
            sleep 15
          done
          SAMPLER
          : > "$RUNNER_TEMP/memavail.log"
          nohup setsid bash "$RUNNER_TEMP/memsampler.sh" "$RUNNER_TEMP/memavail.log" "$RUNNER_TEMP/memsampler.pid" > /dev/null 2>&1 &
      # ccache keeps its counters in the cache directory, so a restored cache
      # carries the last run's: zero them to read this run's hit rate.
      - name: Compiler cache statistics reset
        continue-on-error: true
        run: ccache --zero-stats
      - name: Build
        # Align the environment and explicit CLI limit for predictable
        # compiler concurrency on every runner.
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.platform == 'macos' && '2' || '6' }}
          SUPPLE_CI_TARGETS: ${{ inputs.targets }}
          SUPPLE_CI_TESTS: ${{ inputs.tests }}
          SUPPLE_CI_REPEAT: ${{ inputs.repeat }}
          SUPPLE_CI_SCRIBBLE: ${{ inputs.scribble }}
        run: |
          if [[ -n "$SUPPLE_CI_TARGETS$SUPPLE_CI_TESTS$SUPPLE_CI_REPEAT" || "$SUPPLE_CI_SCRIBBLE" == true ]]; then
            narrowed="targets '$SUPPLE_CI_TARGETS', tests '$SUPPLE_CI_TESTS', repeat '$SUPPLE_CI_REPEAT', scribble ${SUPPLE_CI_SCRIBBLE:-false}"
            narrowed="${narrowed//[$'\r\n%']/ }"
            echo "::warning title=Iteration run::not a merge gate: $narrowed"
            printf '**Iteration run, not a merge gate:** %s\n' "$narrowed" >> "$GITHUB_STEP_SUMMARY"
          fi
          build_log="$RUNNER_TEMP/native-build.log"
          target_args=()
          for target in $SUPPLE_CI_TARGETS; do target_args+=(--target "$target"); done
          if cmake --build --preset ${{ matrix.preset }} "${target_args[@]}" --parallel "$CMAKE_BUILD_PARALLEL_LEVEL" -- -k 0 2>&1 | tee "$build_log"; then
            :
          elif [[ '${{ matrix.platform }}' == windows ]] && tr -d '\000' < "$build_log" | grep -F 'The process cannot access the file because it is being used by another process.' > /dev/null; then
            # Temporary scanner/file locks can race manifest embedding. Ninja
            # has finished the other targets; retry only its unfinished work.
            sleep 1
            cmake --build --preset ${{ matrix.preset }} "${target_args[@]}" --parallel "$CMAKE_BUILD_PARALLEL_LEVEL" -- -k 0
          else
            exit 1
          fi
      - name: Linux memory and disk after Build
        if: always() && matrix.platform == 'linux'
        continue-on-error: true
        run: |
          if [[ -f "$RUNNER_TEMP/memsampler.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/memsampler.pid")" 2>/dev/null || true
          fi
          free -m
          df -h / "$GITHUB_WORKSPACE"
          du -sh build/${{ matrix.preset }} .deps .compiler-cache 2>/dev/null || true
          if [[ -s "$RUNNER_TEMP/memavail.log" ]]; then
            echo "Build step samples (time, MemAvailable MB, root free MB): $(wc -l < "$RUNNER_TEMP/memavail.log")"
            echo "lowest MemAvailable:"; sort -k2,2n "$RUNNER_TEMP/memavail.log" | sed -n 1p
            echo "lowest root free:"; sort -k3,3n "$RUNNER_TEMP/memavail.log" | sed -n 1p
            echo "last ten:"; tail -n 10 "$RUNNER_TEMP/memavail.log"
          fi
      - name: Compiler cache statistics after Build
        if: always()
        continue-on-error: true
        run: |
          ccache --show-stats --verbose
          ccache --show-config | grep -E '^\(.*\) (cache_dir|max_size) ' || true
      - name: Test Linux (software OpenGL under Xvfb)
        if: matrix.platform == 'linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          TMPDIR: /tmp
          SUPPLE_PICTURE_OUTPUT_DIR: ${{ github.workspace }}/build/${{ matrix.preset }}/pictures
          SUPPLE_CI_TESTS: ${{ inputs.tests }}
          SUPPLE_CI_REPEAT: ${{ inputs.repeat }}
          SUPPLE_CI_SCRIBBLE: ${{ inputs.scribble }}
        run: |
          if [[ "$SUPPLE_CI_SCRIBBLE" == true ]]; then export MALLOC_PERTURB_=165; fi
          xvfb-run -a -s '-screen 0 1920x1080x24' ctest --preset dev ${SUPPLE_CI_TESTS:+-R "$SUPPLE_CI_TESTS"} ${SUPPLE_CI_REPEAT:+--repeat "until-fail:$SUPPLE_CI_REPEAT"}
      # The runner's desktop is 1024x768, smaller than the stock editors and
      # the 1320x840 the probes resize them to; win32-embedding can only see
      # what is on screen.
      - name: Windows display resolution
        if: matrix.platform == 'windows'
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Windows software OpenGL for GUI tests
        if: matrix.platform == 'windows'
        run: bash .github/scripts/gui-mesa-windows.sh
      - name: Test portable targets
        if: matrix.platform != 'linux'
        env:
          SUPPLE_PICTURE_OUTPUT_DIR: ${{ github.workspace }}/build/${{ matrix.preset }}/pictures
          SUPPLE_CI_TESTS: ${{ inputs.tests }}
          SUPPLE_CI_REPEAT: ${{ inputs.repeat }}
          SUPPLE_CI_SCRIBBLE: ${{ inputs.scribble }}
        # The macOS runner has three cores: six tests at once there pushed the
        # instruments' reset, state and validator checks past their timeouts.
        # libmalloc reads MallocScribble when it is set at all, even empty, so
        # it is exported only when asked. Windows has no counterpart here.
        run: |
          if [[ "$SUPPLE_CI_SCRIBBLE" == true && '${{ matrix.platform }}' == macos ]]; then
            export MallocPreScribble=1 MallocScribble=1
          fi
          ctest --preset ${{ matrix.preset }} ${{ matrix.platform == 'macos' && '--parallel 3' || '' }} ${SUPPLE_CI_TESTS:+-R "$SUPPLE_CI_TESTS"} ${SUPPLE_CI_REPEAT:+--repeat "until-fail:$SUPPLE_CI_REPEAT"}
      - name: Linux memory and disk after tests
        if: always() && matrix.platform == 'linux'
        continue-on-error: true
        run: |
          free -m
          df -h / "$GITHUB_WORKSPACE"
      # The compiler caches are saved whatever Build and the tests did (always()),
      # so a seed run on main (CONTRIBUTING.md) saves even when its test entry
      # fails; only an exact hit on the commit's own key skips the save. The
      # dependency cache is saved earlier and only after its steps passed, so a
      # failed install never leaves a half-filled .deps under the exact key.
      - name: Save Linux compiler cache
        if: always() && matrix.platform == 'linux' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .compiler-cache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Save Windows compiler cache
        if: always() && matrix.platform == 'windows' && steps.windows-compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .compiler-cache
          key: ${{ steps.windows-compiler-cache.outputs.cache-primary-key }}
      - name: Save macOS compiler cache
        if: always() && matrix.platform == 'macos' && steps.macos-compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .compiler-cache
          key: ${{ steps.macos-compiler-cache.outputs.cache-primary-key }}
      - name: Test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.platform }}
          path: build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
      - name: GUI smoke images
        if: always() && matrix.platform != 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-${{ matrix.platform }}
          path: build/${{ matrix.preset }}/daw/gui/*.png
          if-no-files-found: ignore

      - name: DSP editor pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsp-pictures-${{ matrix.platform }}
          path: build/${{ matrix.preset }}/pictures/*.png
          if-no-files-found: ignore
